<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>La Fiesta de Carbón</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --night:#161229; --panel:#231c3f; --panel2:#2e2552; --line:#4b3e7c;
  --cream:#f4ead5; --muted:#a99cc9; --amber:#ffb547; --pink:#ff5c9d; --mint:#5fe0b0;
  --pix:'Press Start 2P',ui-monospace,monospace;
  --body:'Pixelify Sans',ui-monospace,'Courier New',monospace;
}
html,body{height:100%}
body{background:var(--night);color:var(--cream);font-family:var(--body);font-size:17px;line-height:1.35;padding-inline:16px;padding-block:14px;box-sizing:border-box;
  background-image:radial-gradient(circle at 20% 0%,#2a1f52 0,transparent 55%),radial-gradient(circle at 90% 100%,#301a45 0,transparent 50%);}
*{box-sizing:border-box}
[hidden]{display:none!important}
.wrap{max-width:max(340px,min(960px,calc((100dvh - 200px) * 1.54)));margin:0 auto;display:flex;flex-direction:column;gap:10px}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
h1{font-family:var(--pix);font-size:clamp(13px,2.3vw,20px);margin:0;color:var(--amber);letter-spacing:1px;text-shadow:3px 3px 0 #000;text-wrap:balance}
h1 small{display:block;font-size:.5em;color:var(--muted);margin-top:6px;text-shadow:none;letter-spacing:2px}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.hud{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:6px}
.repcell{grid-column:span 2}
.repline{display:flex;align-items:center;gap:8px}
.repbar{position:relative;flex:1;height:10px;background:#140e2a;border:2px solid #000;min-width:40px}
.repbar i{position:absolute;left:0;top:0;bottom:0;width:70%;background:var(--mint);transition:width .3s,background .3s}
.repbar b{position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;background:var(--cream)}
.quests{display:flex;flex-wrap:wrap;gap:6px;min-height:0}
.q{background:var(--panel);border:2px solid var(--line);padding:3px 8px;font-size:15px;color:var(--muted)}
.q b{color:var(--amber);font-weight:600}
.q.bad{border-color:var(--pink);color:var(--cream)}
.q.task{color:var(--cream)}
.q.task b{color:var(--amber)}
.q.ok{border-color:var(--mint);color:var(--mint);opacity:.75}
.dlg{position:absolute;left:10px;right:10px;bottom:14px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:end;z-index:5}
.dlg.in{animation:dlgIn .38s cubic-bezier(.2,1.35,.4,1)}
@keyframes dlgIn{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.dlgPort{position:relative;width:120px;height:120px;border:3px solid #000;box-shadow:4px 4px 0 #000,inset 0 0 0 2px rgba(255,255,255,.15);background:radial-gradient(circle at 50% 38%,var(--pc,#4a3a8e) 0,#120c26 78%);transition:transform .2s cubic-bezier(.2,1.4,.4,1),filter .2s}
.dlgPort::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px);pointer-events:none}
.dlgPort img{width:100%;height:100%;image-rendering:pixelated;display:block}
.dlgPort.right img{transform:scaleX(-1)}
.dlg.in .dlgPort.left{animation:portL .5s cubic-bezier(.2,1.3,.4,1)}
.dlg.in .dlgPort.right{animation:portR .5s cubic-bezier(.2,1.3,.4,1)}
@keyframes portL{from{transform:translateX(-170px) rotate(-10deg)}}
@keyframes portR{from{transform:translateX(170px) rotate(10deg)}}
.dlgPort.dim{filter:brightness(.42) saturate(.5);transform:translateY(10px) scale(.92)}
.dlgPort.act{transform:translateY(-6px) scale(1.05);box-shadow:4px 4px 0 #000,0 0 0 3px var(--amber)}
.dlgPort .tag{position:absolute;left:-3px;right:-3px;bottom:-16px;background:#000;color:var(--amber);font-family:var(--pix);font-size:7px;text-align:center;padding:4px 2px;letter-spacing:1px;white-space:nowrap;overflow:hidden}
.dlgPort.right .tag{color:#6fb3ff}
.dlgBox{position:relative;background:linear-gradient(180deg,rgba(24,16,50,.97),rgba(12,8,28,.97));border:3px solid var(--cream);box-shadow:4px 4px 0 #000,inset 0 0 0 2px #3a2f6a;padding:10px 14px 12px;min-height:124px;display:flex;flex-direction:column;gap:6px}
.dlgBox::before{content:"";position:absolute;bottom:22px;width:0;height:0;border:9px solid transparent}
.dlgBox.fromL::before{left:-21px;border-right-color:var(--cream)}
.dlgBox.fromR::before{right:-21px;border-left-color:var(--cream)}
.dlgHead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;border-bottom:2px dashed #3a2f6a;padding-bottom:4px}
#dlgRole{font-style:normal;font-family:var(--pix);font-size:7px;color:var(--pink);letter-spacing:1px}
#dlgText.shake{animation:shk .1s steps(2) infinite;color:#ffd0dc}
@keyframes shk{50%{transform:translate(1px,-1px)}}
.dlgBody{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
#dlgName{font-family:var(--pix);font-size:9px;color:#6fb3ff;letter-spacing:1px}
#dlgName.me{color:var(--amber)}
#dlgText{margin:0;font-size:18px;min-height:2.4em;line-height:1.3}
.dlgOpts{display:flex;flex-direction:column;gap:2px}
.dlgOpts button{text-align:left;background:transparent;border:0;color:var(--cream);font-family:var(--body);font-size:17px;padding:2px 6px;cursor:pointer;display:flex;gap:6px;align-items:baseline}
.dlgOpts button .arrow{width:12px;color:var(--amber);font-size:12px}
.dlgOpts button.sel,.dlgOpts button:hover{background:var(--panel2);color:var(--amber)}
.dlgOpts em{font-style:normal;font-size:14px;margin-left:auto;padding-left:10px;color:var(--pink)}
.dlgOpts em.gain{color:var(--mint)}
.dlgMore{align-self:flex-end;font-family:var(--pix);font-size:7px;color:var(--amber);animation:blink .8s steps(2) infinite}
@media (max-width:700px){.dlg{position:fixed;left:6px;right:6px;bottom:10px;z-index:15;gap:6px}.dlgPort{width:64px;height:64px}.dlgPort .tag{font-size:6px}#dlgText{font-size:16px}.dlgOpts button{font-size:15px}.dlgBox{min-height:90px;padding:8px}}
.cell{background:var(--panel);border:2px solid var(--line);padding:5px 9px;display:flex;flex-direction:column;gap:3px;min-width:0}
.label{font-family:var(--pix);font-size:7px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}
.val{font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.val.warn{color:var(--pink);animation:blink .6s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.stage{outline:none;position:relative;border:3px solid var(--line);background:#000;box-shadow:6px 6px 0 #000}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
.hint{min-height:1.4em;color:var(--muted);font-size:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hint b{font-family:var(--pix);font-size:9px;color:var(--night);background:var(--amber);padding:4px 6px;border:2px solid #000}
.hint.active span{color:var(--cream)}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(14,10,30,.74);padding:14px;overflow:auto}
@media (max-width:700px){.overlay{position:fixed;inset:0;z-index:20;background:rgba(14,10,30,.94)}}
.card{background:var(--panel);border:3px solid var(--line);box-shadow:6px 6px 0 #000;padding:16px 18px;max-width:600px;width:100%;display:flex;flex-direction:column;gap:11px;margin:auto}
.card h2{font-family:var(--pix);font-size:clamp(14px,2.4vw,19px);margin:0;color:var(--amber);line-height:1.4;text-wrap:balance}
.card p{margin:0;max-width:62ch}
.eyebrow{font-family:var(--pix);font-size:8px;letter-spacing:2px;color:var(--pink)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{font-family:var(--pix);font-size:10px;letter-spacing:1px;background:var(--amber);color:#1a1230;border:3px solid #000;box-shadow:3px 3px 0 #000;padding:9px 12px;cursor:pointer}
.btn.ghost{background:var(--panel2);color:var(--cream)}
.btn.small{font-size:8px;padding:7px 9px}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.btn:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
.methods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.method{background:var(--panel2);border:2px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.method img{width:40px;height:40px;image-rendering:pixelated}
.who img{width:56px;height:56px;image-rendering:pixelated;flex:none}
.method b{font-family:var(--pix);font-size:8px;color:var(--mint);letter-spacing:1px}
.method span{font-size:15px;color:var(--muted)}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.who{display:flex;gap:10px;align-items:center;background:var(--panel2);border:2px solid var(--line);padding:6px 8px}
.who b{font-family:var(--pix);font-size:9px;color:var(--cream);display:block;margin-bottom:3px}
.who span{font-size:15px;color:var(--muted);display:block}
.tip{border-left:4px solid var(--mint);padding-left:10px;color:var(--cream)}
.facts{font-size:15px;color:var(--muted)}
.keys{font-size:15px;color:var(--muted)}
kbd{font-family:var(--pix);font-size:8px;background:var(--panel2);border:2px solid var(--line);padding:2px 5px;color:var(--cream)}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.lvl{text-align:left;display:flex;flex-direction:column;gap:6px;background:var(--panel2);color:var(--cream);border:3px solid #000;box-shadow:3px 3px 0 #000;padding:10px;cursor:pointer;font-family:var(--body);font-size:16px}
.lvl .n{font-family:var(--pix);font-size:8px;color:var(--pink)}
.lvl .s{font-family:var(--pix);font-size:10px;color:var(--amber);letter-spacing:2px}
.lvl:disabled{opacity:.45;cursor:not-allowed}
.stars{font-family:var(--pix);font-size:22px;color:var(--amber);letter-spacing:6px}
.stars .off{color:#4b3e7c}
.score{display:grid;grid-template-columns:1fr auto;gap:3px 16px;font-variant-numeric:tabular-nums;max-width:320px}
.score .t{border-top:2px solid var(--line);padding-top:4px;font-weight:600}
.pad{display:none;justify-content:space-between;align-items:center;gap:16px;user-select:none;-webkit-user-select:none;touch-action:none;padding-block:4px}
@media (pointer:coarse){.pad{display:flex}}
.dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:4px}
.dpad button,.abtn{background:var(--panel2);border:3px solid #000;box-shadow:3px 3px 0 #000;color:var(--cream);font-family:var(--pix);font-size:12px;touch-action:none}
.dpad .u{grid-column:2;grid-row:1}.dpad .l{grid-column:1;grid-row:2}.dpad .r{grid-column:3;grid-row:2}.dpad .d{grid-column:2;grid-row:3}
.abtn{width:88px;height:88px;border-radius:50%;background:var(--amber);color:#1a1230;font-size:10px}
.abtns{display:flex;gap:10px;align-items:flex-end}
.bbtn{width:70px;height:70px;background:var(--pink);font-size:8px;margin-bottom:26px}
.cbtn{background:#6fb3ff;font-size:7px;margin-bottom:60px}
.pad button.on{transform:translate(2px,2px);box-shadow:1px 1px 0 #000;filter:brightness(1.2)}
@media (max-width:760px){.hud{grid-template-columns:repeat(2,minmax(0,1fr))}.repcell{grid-column:1/-1}}
@media (max-width:560px){.methods{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.val.warn{animation:none}}
.load{align-items:center;text-align:center;max-width:460px}
.load h2{font-size:clamp(16px,3vw,22px)}
.ldtrack{position:relative;width:100%;height:58px}
.ldtrack img{position:absolute;bottom:0;width:48px;height:48px;image-rendering:pixelated;transform:translateX(-50%);animation:ldhop .36s steps(2) infinite}
@keyframes ldhop{50%{bottom:5px}}
.ldbar{width:100%;height:16px;border:3px solid #000;background:#140e2a;box-shadow:3px 3px 0 #000}
.ldbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--amber));transition:width .15s}
.ldmsg{font-size:16px;color:var(--muted);min-height:1.4em}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <h1>La Fiesta de Carbón<small id="hLevel">UN GATO NEGRO, UNA CASA HECHA UN LÍO</small></h1>
    <div class="tools">
      <button class="btn small ghost" id="bLevels">Niveles</button>
      <button class="btn small ghost" id="bPause">Pausa</button>
      <button class="btn small ghost" id="bZoom">Vista: cerca</button>
      <button class="btn small ghost" id="bSound">Sonido: sí</button>
    </div>
  </header>

  <div class="hud">
    <div class="cell"><span class="label" id="lTime">Tu humano llega en</span><span class="val" id="hTime">1:50</span></div>
    <div class="cell repcell"><span class="label">Reputación en el barrio</span><div class="repline"><span class="val" id="hRep">70</span><div class="repbar" title="Mínimo para ganar: 50"><i id="hRepFill"></i><b></b></div></div></div>
    <div class="cell"><span class="label" id="lCats">Invitados en casa</span><span class="val" id="hCats">0</span></div>
    <div class="cell"><span class="label" id="lMess">Cosas tiradas</span><span class="val" id="hMess">0</span></div>
    <div class="cell"><span class="label" id="lHeld">En la boca</span><span class="val" id="hHeld">nada</span></div>
  </div>

  <div class="stage" id="stage" tabindex="0">
    <canvas id="game" aria-label="Pantalla del juego"></canvas>
    <div class="dlg" id="dlg" hidden><div class="dlgPort left" id="pL"><img id="imgL" alt=""><span class="tag">CARBÓN</span></div><div class="dlgBox" id="dlgBox"><div class="dlgHead"><b id="dlgName"></b><em id="dlgRole"></em></div><p id="dlgText"></p><div id="dlgOpts" class="dlgOpts"></div><span class="dlgMore" id="dlgMore" hidden>▼ ESPACIO</span></div><div class="dlgPort right" id="pR"><img id="imgR" alt=""><span class="tag" id="tagR"></span></div></div>
    <div class="overlay" id="ov"></div>
  </div>

  <div class="hint" id="hint"><b>ESPACIO</b><span>Movete con las flechas. Si el teclado no responde, hacé clic sobre el juego.</span></div>

  <div class="quests" id="quests" aria-live="polite"></div>

  <div class="pad" id="pad">
    <div class="dpad">
      <button class="u" data-k="up" aria-label="Arriba">▲</button>
      <button class="l" data-k="left" aria-label="Izquierda">◀</button>
      <button class="r" data-k="right" aria-label="Derecha">▶</button>
      <button class="d" data-k="down" aria-label="Abajo">▼</button>
    </div>
    <div class="abtns"><button class="abtn bbtn cbtn" id="cBtn">ESPECIAL</button><button class="abtn bbtn" id="bBtn">MORDER</button><button class="abtn" id="aBtn">ACCIÓN</button></div>
  </div>
</div>

/* ---------- cargar nivel ---------- */
function loadLevel(i){
  LI=i;lv=LEVELS[i];map=lv.map;bg=paintMap(map);H=null;CINE=null;doorOpen=0;eproj=[];camShake=0;arrT=0;musicMode='house';
  cats=[];items=[];popups=[];parts=[];bins=[];fridges=[];
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const ch=map[y][x];if(ch==='X')bins.push([x,y]);if(ch==='F')fridges.push([x,y]);if(ch==='D')doorT=[x,y];}
  const sx=doorT[0],sy=doorT[1]-1;
  player={x:sx*T+8,y:sy*T+13,face:1,dir:'down',idle:0,anim:0,held:null,busy:null,stun:0,swat:0,swatCd:0,moving:false};
  const free=[];
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){if(SOLID.has(map[y][x]))continue;if(Math.abs(x-sx)+Math.abs(y-sy)<=2)continue;free.push([x,y]);}
  shuffle(free);
  lv.cats.forEach(k=>{
    const [x,y]=free.pop();const d=TYPES[k];
    cats.push({key:k,def:d,huntCd:(d.pers==='agresivo'?28:14)+Math.random()*14,hunting:false,known:false,quest:false,woke:false,carry:null,pctNeed:d.pers==='fiestero'?d.pct:0,tx:x,ty:y,x:x*T+8,y:y*T+13,hp:d.hp,state:d.sleeps?'sleep':'wander',moving:false,tgt:null,spd:0,wait:Math.random()*2,face:1,dir:'down',seed:Math.random()*3,anim:Math.random(),stun:0,boxT:0});
  });
  const pool=shuffle(free.slice());
  (lv.messList||Array.from({length:lv.mess||0},(_,m)=>MESS_KEYS[m%MESS_KEYS.length])).forEach(t=>{const [x,y]=pool.pop();items.push({kind:'mess',type:t,x:x*T+8,y:y*T+13});});
  const near=pool.filter(([x,y])=>Math.abs(x-sx)+Math.abs(y-sy)<=9);
  for(let b=0;b<lv.boxes;b++){const [x,y]=(near.length?near.splice(Math.floor(Math.random()*near.length),1)[0]:pool.pop());items.push({kind:'box',type:'caja',x:x*T+8,y:y*T+13});}
  timeLeft=lv.time;partyT=lv.party||0;
  buildLights();
  stats={cleaned:0,food:0,box:0,fight:0,fatal:0,nice:0,favor:0,rude:0};
  rep=70;buildHideGroups();const thief=CUCHA.get(map)?cats.find(c=>c.def.steals):null;toyHome=!thief;if(thief)thief.carry='raton';initChores();
}

/* ---------- efectos ---------- */
function say(x,y,text,color='#f4ead5'){popups.push({x,y,text,color,t:1.3});}
function puff(x,y,col,n=6){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=15+Math.random()*30;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-10,t:.5+Math.random()*.3,col});}}

/* ---------- acciones ---------- */
function dist(ax,ay,bx,by){return Math.hypot(ax-bx,ay-by);}
function tileDist(tx,ty){const cx=player.x,cy=player.y-4;const nx=Math.max(tx*T,Math.min(cx,tx*T+T)),ny=Math.max(ty*T,Math.min(cy,ty*T+T));return Math.hypot(cx-nx,cy-ny);}
function nearestTileOf(list,r){let best=null;for(const [x,y] of list){const d=tileDist(x,y);if(d<=r&&(!best||d<best.d))best={x,y,d};}return best;}
function nearestCat(r){let best=null;for(const c of cats){if(c.state!=='wander'&&c.state!=='sleep'&&c.state!=='hunt')continue;const d=dist(c.x,c.y,player.x,player.y);if(d<=r&&(!best||d<best.d))best={c,d};}return best;}
function nearestItem(r){let best=null;for(const it of items){const d=dist(it.x,it.y,player.x,player.y);if(d<=r&&(!best||d<best.d))best={it,d};}return best;}
function dropHeld(){const h=player.held;items.push({kind:h.kind,type:h.type,x:player.x,y:player.y});player.held=null;SFX.drop();}
function snapCat(c){
  if(c.moving){const tx=Math.floor(c.x/T),ty=Math.floor((c.y-4)/T);if(catWalkable(tx,ty,false)){c.tx=tx;c.ty=ty;}c.moving=false;}
  c.x=c.tx*T+8;c.y=c.ty*T+13;
}
function nearCucha(){const cc=CUCHA.get(map);if(!cc)return null;const x=cc[0]*T+8,y=cc[1]*T+12;return dist(player.x,player.y,x,y)<=15?{x,y}:null;}
function boxCost(c){return hostile(c)?-1:(c.state==='sleep'?-2:-8);}
function getAction(){
  const p=player,cat=nearestCat(19);
  if(p.held){
    const h=p.held;
    if(h.kind==='mess'){
      const m=MESS[h.type],bin=nearestTileOf(bins,11),fr=nearestTileOf(fridges,11);
      if(m.dest==='cucha'){
        const cu=nearCucha();
        if(cu)return{label:'Dejar tu ratón en tu cucha',tx:cu.x,ty:cu.y-8,run:()=>{p.held=null;stats.cleaned++;markDone('raton');toyHome=true;SFX.fridge();puff(cu.x,cu.y-4,'#ffd23f',8);say(cu.x,cu.y-10,'¡Tu ratón!','#ffd23f');}};
        return{label:'Soltar tu ratón (va en tu cucha, cerca de la puerta)',run:dropHeld};
      }
      const dk=destOf(h.type),here=nearestTileOf(destTiles(dk),destRange(dk));
      if(here)return{label:destPut(dk,m.name),tx:here.x*T+8,ty:here.y*T+(dk==='window'?8:0),run:()=>{p.held=null;deliver(h.type,dk,here);}};
      const wr=wrongDest(dk);
      if(wr)return{label:cap(m.name)+' '+destWhere(dk)+', no acá',warn:true,tx:wr.x*T+8,ty:wr.y*T,run:()=>{SFX.err();say(p.x,p.y-22,'¡Ahí no!','#ff5c9d');}};
      return{label:'Soltar '+m.name+' ('+destWhere(dk)+')',run:dropHeld};
    }
    if(h.kind==='box'){
      if(cat){const c=cat.c,cost=boxCost(c);
        if(!c.def.box)return{label:c.def.name+' no entra en ninguna caja',warn:true,tx:c.x,ty:c.y-16,run:()=>{SFX.err();say(c.x,c.y-18,'¡No entro!','#ff5c9d');}};
        return{label:'Tapar a '+c.def.name+' con la caja (reputación '+cost+')',warn:cost<-2,tx:c.x,ty:c.y-16,run:()=>{snapCat(c);dropToy(c);c.state='boxed';c.boxT=0;p.held=null;stats.box++;addRep(cost);SFX.box();puff(c.x,c.y-4,'#e0ad6a',8);say(c.x,c.y-18,'¿Eh?','#e0ad6a');}};

/* ---------- movimiento de gatos ---------- */
function moveCat(c,nx,ny,spd){c.moving=true;c.tgt=[nx,ny];c.spd=spd;if(nx!==c.tx){c.face=nx>c.tx?1:-1;c.dir='side';}else c.dir=ny<c.ty?'up':'down';}
function bfs(sx,sy,tx,ty){
  const k=(x,y)=>y*COLS+x,prev=new Map([[k(sx,sy),-1]]),q=[[sx,sy]];
  while(q.length){const [x,y]=q.shift();if(x===tx&&y===ty)break;for(const [dx,dy] of DIRS){const nx=x+dx,ny=y+dy,kk=k(nx,ny);if(prev.has(kk)||!catWalkable(nx,ny,true))continue;prev.set(kk,k(x,y));q.push([nx,ny]);}}
  if(!prev.has(k(tx,ty)))return null;
  const path=[];let cur=k(tx,ty);while(cur!==k(sx,sy)){path.push([cur%COLS,Math.floor(cur/COLS)]);cur=prev.get(cur);}
  return path.reverse();
}
function catExits(){const e=[doorT];if(lv&&!lv.escape)(winTiles||[]).forEach(([x])=>{if(catWalkable(x,1,false))e.push([x,1]);});return e;}
function bfsTo(sx,sy,targets){
  const k=(x,y)=>y*COLS+x,TG=new Set(targets.map(([x,y])=>k(x,y)));if(TG.has(k(sx,sy)))return[];
  const prev=new Map([[k(sx,sy),-1]]),q=[[sx,sy]];let end=null;
  while(q.length){const [x,y]=q.shift();if(TG.has(k(x,y))){end=k(x,y);break;}for(const [dx,dy] of DIRS){const nx=x+dx,ny=y+dy,kk=k(nx,ny);if(prev.has(kk)||!catWalkable(nx,ny,true))continue;prev.set(kk,k(x,y));q.push([nx,ny]);}}
  if(end===null)return null;const path=[];let cur=end;while(cur!==k(sx,sy)){path.push([cur%COLS,Math.floor(cur/COLS)]);cur=prev.get(cur);}return path.reverse();
}
function catGone(c){
  const byWin=!(c.tx===doorT[0]&&c.ty===doorT[1]);c.state='gone';
  if(byWin){flys.push({cat:c.key,x0:c.x,y0:c.y-8,x1:c.x,y1:4,t:0});say(c.x,c.y-20,'¡Por la ventana!','#f4ead5');SFX.jump();}
  else{puff(c.x,c.y-6,'#a99cc9',8);say(c.x,c.y-20,'¡Chau!','#f4ead5');}
}
function onArrive(c){
  if((c.state==='leaving'||c.state==='fleeing')&&catExits().some(e=>e[0]===c.tx&&e[1]===c.ty)){catGone(c);return;}
  if(c.state==='wander'&&c.def.food){
    const f=items.find(it=>it.kind==='food'&&dist(it.x,it.y,c.x,c.y)<9);
    if(f&&c.def.pers==='hambriento'){items.splice(items.indexOf(f),1);leaveHappy(c,5,'¡Ñam!');}
  }
}
function updateCat(c,dt){
  if(c.state==='gone')return;
  c.anim+=dt;
  if(c.state!=='boxed'&&c.state!=='sleep'&&updateHunt(c,dt))return;
  if(c.state==='boxed'){
    if(c.def.escape){c.boxT+=dt;if(c.boxT>=c.def.escape){c.state='wander';stats.box--;items.push({kind:'box',type:'caja',x:c.x,y:c.y});c.wait=0;say(c.x,c.y-22,'¡Libre!','#5aa9ff');SFX.meow();}}
    return;
  }
  if(c.state==='sleep')return;
  if(c.stun>0){c.stun-=dt;if(!c.moving)return;}
  if(c.moving){
    const gx=c.tgt[0]*T+8,gy=c.tgt[1]*T+13,dx=gx-c.x,dy=gy-c.y,d=Math.hypot(dx,dy),st=c.spd*dt;
    if(d<=st){c.x=gx;c.y=gy;c.tx=c.tgt[0];c.ty=c.tgt[1];c.moving=false;onArrive(c);}else{c.x+=dx/d*st;c.y+=dy/d*st;}
    return;
  }
  if(c.state==='hunt')return;
  if(c.state==='panic'){const opts=shuffle(DIRS.slice()).filter(([dx,dy])=>catWalkable(c.tx+dx,c.ty+dy,false));if(opts.length){const [dx,dy]=opts[0];moveCat(c,c.tx+dx,c.ty+dy,72+Math.random()*24);}return;}
  if(c.state==='leaving'||c.state==='fleeing'){
    const path=bfsTo(c.tx,c.ty,catExits());
    if(path&&path.length){const [nx,ny]=path[0];moveCat(c,nx,ny,c.state==='fleeing'?62:(lv&&lv.escape?92:44));}
    else if(path)catGone(c);
    return;
  }
  if(c.wait>0){c.wait-=dt;return;}
  if(Math.random()<.45){c.wait=1+Math.random()*2.5;c.dir='down';return;}
  const opts=shuffle(DIRS.slice()).filter(([dx,dy])=>catWalkable(c.tx+dx,c.ty+dy,false));
  if(opts.length){const [dx,dy]=opts[0];moveCat(c,c.tx+dx,c.ty+dy,c.def.speed);}
  else c.wait=.5;
}

/* ---------- actualización ---------- */
function updatePlayer(dt){
  const p=player;
  p.swat=Math.max(0,p.swat-dt);p.swatCd=Math.max(0,p.swatCd-dt);
  if(p.stun>0){p.stun-=dt;p.moving=false;return;}
  if(p.busy&&p.busy.fn){p.busy.t+=dt;p.moving=false;if(p.busy.t>=p.busy.dur){const f=p.busy.fn;p.busy=null;f();}return;}
  if(p.busy&&p.busy.search){p.busy.t+=dt;p.moving=false;if(p.busy.t>=p.busy.dur){const hs=p.busy.search;p.busy=null;finishSearch(hs);}return;}
  if(p.busy){
    p.busy.t+=dt;p.moving=false;
    if(Math.random()<.3)puff(p.busy.item.x+(Math.random()*10-5),p.busy.item.y-4,'#f4ead5',1);
    if(p.busy.t>=p.busy.dur){const o=p.busy.item;const i=items.indexOf(o);if(i>=0)items.splice(i,1);stats.cleaned++;markDone(o.type);SFX.trash();puff(o.x,o.y-4,'#ffd23f',8);say(o.x,o.y-16,'+10','#5fe0b0');p.busy=null;}
    return;
  }
  let vx=(keys.right?1:0)-(keys.left?1:0),vy=(keys.down?1:0)-(keys.up?1:0);
  p.moving=!!(vx||vy);
  if(!p.moving){p.idle+=dt;if(p.idle>.6)p.dir='down';return;}
  p.idle=0;p.dir=Math.abs(vx)>=Math.abs(vy)?'side':(vy<0?'up':'down');
  const n=Math.hypot(vx,vy);vx/=n;vy/=n;if(vx)p.face=vx>0?1:-1;
  const sp=64*dt;p.anim+=dt;
  const hit=(x,y)=>{for(const [cx,cy] of [[x-4,y-5],[x+4,y-5],[x-4,y-.01],[x+4,y-.01]])if(blockedForPlayer(Math.floor(cx/T),Math.floor(cy/T)))return true;return false;};
  if(!hit(p.x+vx*sp,p.y))p.x+=vx*sp;
  if(!hit(p.x,p.y+vy*sp))p.y+=vy*sp;
}
let arrT=0;

  cats.push({key:k,def:d,huntCd:30,hunting:false,known:false,quest:false,woke:false,carry:null,pctNeed:0,tx:x,ty:y,x:x*T+8,y:y*T+13,hp:d.hp,state:'wander',moving:false,tgt:null,spd:0,wait:.5,face:1,dir:'down',seed:Math.random()*3,anim:0,stun:0,boxT:0});

function update(dt){
  if(lv.escape){updateEscape(dt);return;}
  timeLeft-=dt;
  if(timeLeft<=0){timeLeft=0;if(lv.impossible)startArrival();else if(lv.love)loseLove();else lose();return;}
  if(lv.arrivals){arrT+=dt;if(arrT>lv.arrivals&&cats.filter(c=>c.state!=='gone').length<34){arrT=0;spawnGuest();}}
  updatePlayer(dt);
  cats.forEach(c=>updateCat(c,dt));
  if(lv.love){updateLove(dt);return;}
  if(lv.party){
    partyT-=dt;
    if(partyT<=0){
      partyT=lv.party;
      const party=cats.filter(c=>c.state==='wander'&&!c.moving);
      if(party.length&&items.length<30){
        const c=party[Math.floor(Math.random()*party.length)];
        if(!items.some(it=>dist(it.x,it.y,c.x,c.y)<10)){items.push({kind:'mess',type:pickParty(),x:c.x,y:c.y});say(c.x,c.y-22,'¡Fiesta!','#ff5c9d');SFX.err();}
      }
    }
  }
  const pct=cleanPct();
  cats.forEach(c=>{if(c.pctNeed&&(c.state==='wander'||c.state==='sleep')&&pct>=c.pctNeed-1e-6){leaveHappy(c,4,'¡Qué fiestón! Chau');}});
  hidden=hidden.filter(h=>h.chore||!['gone','leaving','fleeing','boxed'].includes(h.owner.state));
  items=items.filter(it=>!(it.kind==='lost'&&(it.owner.state==='gone'||it.owner.state==='leaving'||it.owner.state==='fleeing'||it.owner.state==='boxed')));
  if(player.held&&player.held.kind==='lost'&&['gone','leaving','fleeing','boxed'].includes(player.held.owner.state))player.held=null;
  if(rep<=0&&!lv.impossible){loseRep();return;}
  if(!lv.impossible&&tasksLeft()===0&&cats.every(c=>c.state==='gone'||c.state==='boxed')){if(rep<REP_MIN)loseRep();else win();}
}
function updateFx(dt){

  popups.forEach(p=>{p.t-=dt;p.y-=12*dt;});popups=popups.filter(p=>p.t>0);

function clusterTiles(list){

    while(q.length){const [a,b]=q.pop();x0=Math.min(x0,a);x1=Math.max(x1,a);y0=Math.min(y0,b);y1=Math.max(y1,b);for(const [dx,dy] of DIRS){const k2=key(a+dx,b+dy);if(S.has(k2)&&!seen.has(k2)){seen.add(k2);q.push([a+dx,b+dy]);}}}
    out.push({x0,x1,y0,y1});}
  return out;
}

  cast.forEach(([k,f])=>['walk0','walk1','swalk0','swalk1','run0','run1'].forEach(p=>jobs.push(()=>catHD(k,p,false,f))));

    const k=Math.min(i/jobs.length,(performance.now()-t0)/1800),fill=$('#ldFill'),cat=$('#ldCat'),msg=$('#ldMsg');

}
ov.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;initAudio();
  const a=b.dataset.act;
  if(a==='start')startStory();
  else if(a==='levels')showLevels();
  else if(a==='title')showTitle();
  else if(a==='lvl')showIntro(+b.dataset.i);
  else if(a==='begin')begin();
  else if(a==='dance'){DLEV=+b.dataset.d;begin();}
  else if(a==='next')showIntro(LI+1);
  else if(a==='retry')showIntro(LI);
  else if(a==='resume')pause();
  else if(a==='escbegin')begin();
});
$('#bLevels').onclick=()=>{initAudio();if(state==='play')state='pause';showLevels();};
$('#bPause').onclick=()=>{if(state==='play'||state==='pause')pause();};
const bZoom=$('#bZoom');bZoom.textContent='Vista: '+(zoomNear?'cerca':'lejos');
bZoom.onclick=()=>{zoomNear=!zoomNear;camSnap=true;bZoom.textContent='Vista: '+(zoomNear?'cerca':'lejos');try{localStorage.setItem(SAVE_KEY+'-zoom',zoomNear?'cerca':'lejos');}catch(e){}};
$('#bSound').onclick=e=>{initAudio();muted=!muted;e.currentTarget.textContent='Sonido: '+(muted?'no':'sí');};

/* ---------- controles ---------- */
const KMAP={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
addEventListener('keydown',e=>{
  if(state==='cine'&&CINE&&CINE.type==='wake'&&(e.code==='Space'||e.code==='Enter')){e.preventDefault();CINE.t=Math.max(CINE.t,5.1);return;}
  if(state==='story'&&(e.code==='Escape'||e.code==='KeyS')&&!e.repeat){e.preventDefault();endStory();return;}
  if((state==='talk'||state==='dance'||state==='story')&&D){
    if(e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();moveSel(-1);}
    else if(e.code==='ArrowDown'||e.code==='KeyS'){e.preventDefault();moveSel(1);}
    else if(e.code==='Space'||e.code==='Enter'||e.code==='KeyZ'||e.code==='KeyJ'){e.preventDefault();if(!e.repeat)advance();}
    return;
  }
  if(state==='story'){if(e.code==='Space'||e.code==='Enter')e.preventDefault();return;}
  if(state==='run'){const kr=KMAP[e.code];if(kr){e.preventDefault();if(!e.repeat)runKey(kr);}if(e.code==='Space'){e.preventDefault();if(!e.repeat)runKey('up');}return;}
  if(state==='dance'){const kd=KMAP[e.code];if(kd){e.preventDefault();if(!e.repeat)dancePress(LANES.indexOf(kd));}if(e.code==='Space')e.preventDefault();return;}
  if(state==='fight'&&F){
    if(e.code==='Space'||e.code==='KeyZ'||e.code==='KeyJ'){e.preventDefault();if(!e.repeat)F.in.scratch=true;}
    if(e.code==='KeyX'||e.code==='KeyK'){e.preventDefault();if(!e.repeat)F.in.bite=true;}
    if(e.code==='KeyC'||e.code==='KeyL'||e.code==='ShiftLeft'||e.code==='ShiftRight'){e.preventDefault();if(!e.repeat)F.in.special=true;}
    if((e.code==='ArrowUp'||e.code==='KeyW')&&!e.repeat)F.in.jump=true;
    const kk=KMAP[e.code];if(kk){keys[kk]=true;e.preventDefault();}
    return;
  }
  if(e.code==='Enter'&&state==='intro'){e.preventDefault();begin();return;}
  const k=KMAP[e.code];
  if(k){keys[k]=true;if(state==='play')e.preventDefault();}
  if((e.code==='Space'||e.code==='KeyZ'||e.code==='KeyJ')&&state==='play'){e.preventDefault();if(!e.repeat)doAction();}
  if(e.code==='KeyP'||e.code==='Escape'){if(state==='play'||state==='pause'){e.preventDefault();pause();}}
  if(e.code==='KeyV'){bZoom.click();}
  if(e.code==='KeyR'&&(state==='play'||state==='pause'))showIntro(LI);
});
addEventListener('keyup',e=>{const k=KMAP[e.code];if(k)keys[k]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;
  if(state==='play'){state='pause';show(`<div class="card"><p class="eyebrow">JUEGO EN PAUSA</p><h2>El teclado se fue a otra parte de la pantalla</h2><p>Hacé clic en el botón para volver a jugar. Mientras jugás, las flechas y el Espacio tienen que apretarse con el juego seleccionado.</p><div class="row"><button class="btn" data-act="resume">Seguir jugando</button></div></div>`);}
});
hint.addEventListener('click',()=>{if(state==='story')endStory();});
$('#stage').addEventListener('pointerdown',()=>{if(state==='play')grabFocus();});
document.querySelectorAll('.dpad button').forEach(b=>{
  const k=b.dataset.k;
  const on=e=>{e.preventDefault();initAudio();if(state==='talk'||((state==='dance'||state==='story')&&D)){if(k==='up')moveSel(-1);if(k==='down')moveSel(1);return;}if(state==='dance'){dancePress(LANES.indexOf(k));b.classList.add('on');return;}if(state==='run'){runKey(k);b.classList.add('on');return;}keys[k]=true;if(k==='up'&&state==='fight'&&F)F.in.jump=true;b.classList.add('on');try{b.setPointerCapture(e.pointerId);}catch(_){}};
  const off=()=>{keys[k]=false;b.classList.remove('on');};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off);
});
const aBtn=$('#aBtn');
aBtn.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();aBtn.classList.add('on');if(state==='fight'&&F)F.in.scratch=true;else if(state==='run')runKey('up');else if(state==='talk'||((state==='dance'||state==='story')&&D))advance();else if(state==='cine'&&CINE&&CINE.type==='wake')CINE.t=Math.max(CINE.t,5.1);else doAction();});
const cBtn=$('#cBtn');
cBtn.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();cBtn.classList.add('on');if(state==='fight'&&F)F.in.special=true;else if(state==='run')runKey('up');else if(state==='talk'||((state==='dance'||state==='story')&&D))advance();else if(state==='cine'&&CINE&&CINE.type==='wake')CINE.t=Math.max(CINE.t,5.1);else doAction();});
['pointerup','pointercancel','pointerleave'].forEach(t=>cBtn.addEventListener(t,()=>cBtn.classList.remove('on')));
const bBtn=$('#bBtn');
bBtn.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();bBtn.classList.add('on');if(state==='fight'&&F)F.in.bite=true;else if(state==='run')runKey('up');else if(state==='talk'||((state==='dance'||state==='story')&&D))advance();else if(state==='cine'&&CINE&&CINE.type==='wake')CINE.t=Math.max(CINE.t,5.1);else doAction();});
dlgOpts.addEventListener('click',e=>{const b=e.target.closest('button');if(b&&D&&D.opts){D.sel=+b.dataset.i;pickOpt(D.sel);}});
dlg.addEventListener('click',e=>{if(!e.target.closest('button')&&D&&!D.opts)advance();});
['pointerup','pointercancel','pointerleave'].forEach(t=>bBtn.addEventListener(t,()=>bBtn.classList.remove('on')));
['pointerup','pointercancel','pointerleave'].forEach(t=>aBtn.addEventListener(t,()=>aBtn.classList.remove('on')));

/* ---------- bucle ---------- */
let last=performance.now(),lastRaf=performance.now();
function step(now){
  const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;clock+=dt;
  if(state==='play'){update(dt);introT=Math.max(0,introT-dt);}
  else if(state==='fight'&&F)updateFight(dt);
  else if(state==='cine'&&CINE){updateCine(dt);cats.forEach(c=>{c.anim+=dt;});}
  else if(state==='dance'){updateDance(dt);tickTalk(dt);}
  else if(state==='run')updateRun(dt);
  else if(state==='story'){updateStory(dt);tickTalk(dt);}
  else if(state==='talk'){tickTalk(dt);cats.forEach(c=>updateCat(c,dt));}
  else if(state==='title'||state==='select'||state==='intro')cats.forEach(c=>updateCat(c,dt));
  updateQuests(dt);
  updateFx(dt);render();updateHud();
}
function loop(now){lastRaf=performance.now();step(performance.now());requestAnimationFrame(loop);}
setInterval(()=>{const n=performance.now();if(n-lastRaf>200)step(n);},33);
startLoading();
(document.fonts&&document.fonts.load?document.fonts.load('8px "Press Start 2P"'):Promise.resolve()).catch(()=>{});
requestAnimationFrame(loop);
})();
</script>
